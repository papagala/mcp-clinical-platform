# kagent ArgoCD Application — GitOps deployment
# Installs kagent v0.9.12 with CRDs into the kagent namespace
# v0.9.12 adds: HITL requireApproval on Agent tools, native Anthropic provider,
# and the SandboxAgent / AgentHarness CRDs (Agent Substrate).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kagent
  sources:
    # kagent CRDs (installed first)
    - repoURL: ghcr.io/kagent-dev/kagent/helm
      chart: kagent-crds
      targetRevision: 0.10.0-rc3
    # kagent main chart
    - repoURL: ghcr.io/kagent-dev/kagent/helm
      chart: kagent
      targetRevision: 0.10.0-rc3
      helm:
        values: |
          # Pull from ghcr.io: the default cr.kagent.dev registry does not carry
          # the golang-adk runtime image for 0.9.12, so `runtime: go` agents fail
          # with ImagePullBackOff. ghcr.io has the full set.
          registry: ghcr.io
          providers:
            default: openAI
            openAI:
              provider: OpenAI
              model: "gpt-4.1-mini"
              apiKeySecretRef: kagent-openai
              apiKeySecretKey: OPENAI_API_KEY
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
