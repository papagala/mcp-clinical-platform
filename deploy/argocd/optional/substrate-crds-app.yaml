# OPTIONAL — Agent Substrate CRDs (WorkerPool, ActorTemplate, ...).
# Pinned to 0.0.6 to match the substrate subchart bundled by kagent 0.9.12.
# Not applied by `make create` — brought up by `make substrate`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/substrate/helm
    chart: substrate-crds
    targetRevision: 0.0.6
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
