# m3 MCP Server ArgoCD Application — GitOps deployment
# Deploys the m3 MIMIC-IV MCP server from this repository's helm chart
#
# ⚠️  UPDATE repoURL to your fork/repo before deploying
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: m3
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # TODO: Change this to your repository URL
    repoURL: https://github.com/YOUR_USERNAME/mcp-clinical-platform.git
    targetRevision: HEAD
    path: helm-charts/m3
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
