# agentgateway configuration — Federated MCP Gateway
# Multiplexes kagent, m3, and agentregistry MCP servers into a single endpoint.
# VS Code / Cursor / any MCP client connects to http://localhost:4000/
#
# Architecture:
#   VS Code → agentgateway(:4000) → kagent MCP(:8083/mcp)
#                                  → m3 MCP(:3000/mcp)
#                                  → agentregistry MCP(:31313/mcp)
#
# Tools exposed (auto-prefixed by target name):
#   kagent_list_agents      — List all kagent agents
#   kagent_invoke_agent     — Invoke a kagent agent by name
#   m3_get_database_schema  — Discover MIMIC-IV tables
#   m3_get_table_info       — Explore table structure
#   m3_execute_mimic_query  — Run SQL SELECT queries
#   m3_get_icu_stays        — Get ICU stay data
#   m3_get_lab_results      — Get lab test results
#   m3_get_race_distribution — Get race distribution stats
#   registry_*              — agentregistry catalog tools
#
# yaml-language-server: $schema=https://agentgateway.dev/schema/config
binds:
  - port: 4000
    listeners:
      - routes:
          - policies:
              cors:
                allowOrigins:
                  - "*"
                allowHeaders:
                  - "*"
                exposeHeaders:
                  - "Mcp-Session-Id"
            backends:
              - mcp:
                  targets:
                    # kagent MCP — exposes list_agents + invoke_agent tools
                    - name: kagent
                      mcp:
                        host: http://localhost:8083/mcp
                    # m3 MCP — exposes medical data query tools
                    - name: m3
                      mcp:
                        host: http://localhost:3000/mcp
                    # agentregistry MCP — catalog & governance tools
                    - name: registry
                      mcp:
                        host: http://localhost:31313/mcp
