# Kubernetes Gateway API + agentgateway resources for MCP federation
# Deploys agentgateway proxy that federates kagent, m3, and agentregistry MCP servers.
---
# Gateway API CRDs must be installed first (done in Makefile _gateway-api target)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      allowedRoutes:
        namespaces:
          from: All
---
# Virtual MCP backend — federates all 3 MCP servers
# Tool names are auto-prefixed: kagent_*, m3_*, registry_*
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-federation
  namespace: kagent
spec:
  # Raw SQL over patient records must not be reachable directly. It is exposed
  # only through clinical-ops-agent, where requireApproval gates it — the agent
  # talks to m3 as a K8s Service, bypassing this gateway policy.
  #
  # Without this, any gateway client can call m3_execute_mimic_query and skip
  # the approval entirely. Deny both hides it from tools/list and rejects
  # call_tool.
  #
  # NOTE: this policy MUST sit at spec.policies (backend level). The same block
  # under targets[].static.policies is silently accepted but never enforced in
  # agentgateway v1.0.1. The CEL matches the UNPREFIXED tool name.
  policies:
    mcp:
      authorization:
        action: Deny
        policy:
          matchExpressions:
            - 'mcp.tool.name == "execute_mimic_query"'
  mcp:
    failureMode: FailOpen
    targets:
      - name: kagent
        static:
          host: kagent-controller.kagent.svc.cluster.local
          port: 8083
          protocol: StreamableHTTP
      - name: m3
        static:
          host: m3.kagent.svc.cluster.local
          port: 3000
          protocol: StreamableHTTP
      - name: registry
        static:
          host: agentregistry.kagent.svc.cluster.local
          port: 31313
          protocol: StreamableHTTP
---
# Route /mcp traffic to the federated backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: kagent
spec:
  parentRefs:
    - name: agentgateway-proxy
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp-federation
          group: agentgateway.dev
          kind: AgentgatewayBackend
