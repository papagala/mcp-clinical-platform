# OPTIONAL — Anthropic (Claude) ModelConfig. Default provider is OpenAI.
# Lives under optional/ because `make _agents` applies deploy/kagent-resources/
# non-recursively, so this is inert unless you run `make claude-model`.
#
# Swap an agent onto Claude with one patch:
#   kubectl patch agent clinical-ops-agent -n kagent --type=merge \
#     -p '{"spec":{"declarative":{"modelConfig":"claude-model"}}}'
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: claude-model
  namespace: kagent
spec:
  provider: Anthropic
  model: claude-sonnet-5
  apiKeySecret: kagent-anthropic
  apiKeySecretKey: ANTHROPIC_API_KEY
  anthropic:
    maxTokens: 8192
